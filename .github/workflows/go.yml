name: Go
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 ./...
      - run: go build ./cmd/vault-renderer
