apiVersion: v1
data:
  agent-init.hcl: |
    exit_after_auth = true
    vault {
      address = "https://vault.example.com"
    }
    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role       = "payment-api"
          token_path = "/vault/token/token"
        }
      }
    }
    template {
      contents    = "{{- with secret \"secret/data/payment/database\" -}}\nDB_USERNAME={{ .Data.data.username }}\nDB_PASSWORD={{ .Data.data.password }}\n{{- end }}\n"
      destination = "/vault/secrets/database.env"
      perms       = "0640"
    }
  agent.hcl: |
    exit_after_auth = false
    vault {
      address = "https://vault.example.com"
    }
    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role       = "payment-api"
          token_path = "/vault/token/token"
        }
      }
    }
    template {
      contents    = "{{- with secret \"secret/data/payment/database\" -}}\nDB_USERNAME={{ .Data.data.username }}\nDB_PASSWORD={{ .Data.data.password }}\n{{- end }}\n"
      destination = "/vault/secrets/database.env"
      perms       = "0640"
    }
