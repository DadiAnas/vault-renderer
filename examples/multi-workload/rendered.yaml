apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: payment-api
  name: payment-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      annotations:
        vault-renderer.dadianas.com/checksum: 90c6119e6f76cfc8b942c5c17eac7e4793843227675cd4c10362268ea66c9726
        vault-renderer.dadianas.com/managed: "true"
        vault.hashicorp.com/agent-inject-status: injected
      labels:
        app: payment-api
    spec:
      containers:
        - image: nginx:1.27
          name: api
          volumeMounts:
            - mountPath: /vault/secrets
              name: vault-secrets
              readOnly: true
        - args:
            - agent
            - -config=/vault/config/agent.hcl
          command:
            - /bin/vault
          image: hashicorp/vault:1.20.4
          name: vault-agent
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /vault/secrets
              name: vault-secrets
            - mountPath: /vault/config
              name: vault-agent-config
              readOnly: true
            - mountPath: /vault/token
              name: vault-agent-token
              readOnly: true
      initContainers:
        - args:
            - agent
            - -config=/vault/config/agent-init.hcl
          command:
            - /bin/vault
          image: hashicorp/vault:1.20.4
          name: vault-agent-init
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /vault/secrets
              name: vault-secrets
            - mountPath: /vault/config
              name: vault-agent-config
              readOnly: true
            - mountPath: /vault/token
              name: vault-agent-token
              readOnly: true
      securityContext:
        fsGroup: 1000
      serviceAccountName: payment-api
      volumes:
        - emptyDir:
            medium: Memory
          name: vault-secrets
        - configMap:
            name: payment-api-deployment-vault-agent
          name: vault-agent-config
        - name: vault-agent-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: vault
                  expirationSeconds: 3600
                  path: token
