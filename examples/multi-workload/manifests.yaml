apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  labels: {app: payment-api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: payment-api}
  template:
    metadata:
      labels: {app: payment-api}
    spec:
      serviceAccountName: payment-api
      containers:
        - name: api
          image: nginx:1.27
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: payment-worker
spec:
  serviceName: payment-worker
  replicas: 1
  selector:
    matchLabels: {app: payment-worker}
  template:
    metadata:
      labels: {app: payment-worker}
    spec:
      serviceAccountName: payment-worker
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sleep", "3600"]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-reader
  labels: {vault-injection: enabled}
spec:
  selector:
    matchLabels: {app: node-reader}
  template:
    metadata:
      labels: {app: node-reader}
    spec:
      serviceAccountName: node-reader
      containers:
        - name: reader
          image: busybox:1.36
          command: ["sleep", "3600"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: payment-migration
spec:
  template:
    spec:
      serviceAccountName: payment-migration
      restartPolicy: Never
      containers:
        - name: migration
          image: busybox:1.36
          command: ["true"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-report
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: nightly-report
          restartPolicy: Never
          containers:
            - name: report
              image: busybox:1.36
              command: ["true"]
---
apiVersion: v1
kind: Pod
metadata:
  name: toolbox
  annotations: {example.com/vault: "yes"}
spec:
  serviceAccountName: toolbox
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "3600"]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: legacy-agent
  labels: {vault-injection: enabled}
spec:
  selector:
    matchLabels: {app: legacy-agent}
  template:
    metadata:
      labels: {app: legacy-agent}
    spec:
      containers:
        - name: legacy
          image: busybox:1.36
          command: ["sleep", "3600"]
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
spec:
  selector: {app: payment-api}
  ports:
    - port: 80
      targetPort: 80
