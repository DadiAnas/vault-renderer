apiVersion: v1
data:
  agent-init.hcl: |
    exit_after_auth = true
    vault {
      address = "https://vault.example.com"
    }
    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role       = "reports"
          token_path = "/vault/token/token"
        }
      }
    }
    template {
      contents    = "{{- with secret \"secret/data/reports/config\" -}}\n{{- range $key, $value := .Data -}}\n{{ $key }}: {{ $value }}\n{{- end -}}\n{{- end -}}\n"
      destination = "/vault/secrets/app.env"
      perms       = "0640"
    }
  agent.hcl: |
    exit_after_auth = false
    vault {
      address = "https://vault.example.com"
    }
    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role       = "reports"
          token_path = "/vault/token/token"
        }
      }
    }
    template {
      contents    = "{{- with secret \"secret/data/reports/config\" -}}\n{{- range $key, $value := .Data -}}\n{{ $key }}: {{ $value }}\n{{- end -}}\n{{- end -}}\n"
      destination = "/vault/secrets/app.env"
      perms       = "0640"
    }
kind: ConfigMap
metadata:
  labels:
    vault-renderer.dadianas.com/managed: "true"
  name: reports-deployment-vault-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
spec:
  selector:
    matchLabels:
      app: reports
  template:
    metadata:
      annotations:
        vault-renderer.dadianas.com/checksum: 2ec30db361d0d3ba3f25d5aa8cde285e2b55e1c4689c6f2a1af4e2df2835b59b
        vault-renderer.dadianas.com/managed: "true"
        vault.hashicorp.com/agent-inject-status: injected
      labels:
        app: reports
    spec:
      containers:
        - image: example.com/reports:1.0
          name: reports
          volumeMounts:
            - mountPath: /vault/secrets
              name: vault-secrets
              readOnly: true
        - args:
            - agent
            - -config=/vault/config/agent.hcl
          command:
            - /bin/vault
          image: hashicorp/vault:1.20.4
          name: vault-agent
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /vault/secrets
              name: vault-secrets
            - mountPath: /vault/config
              name: vault-agent-config
              readOnly: true
            - mountPath: /vault/token
              name: vault-agent-token
              readOnly: true
      initContainers:
        - args:
            - agent
            - -config=/vault/config/agent-init.hcl
          command:
            - /bin/vault
          image: hashicorp/vault:1.20.4
          name: vault-agent-init
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /vault/secrets
              name: vault-secrets
            - mountPath: /vault/config
              name: vault-agent-config
              readOnly: true
            - mountPath: /vault/token
              name: vault-agent-token
              readOnly: true
      securityContext:
        fsGroup: 1000
      serviceAccountName: reports
      volumes:
        - emptyDir:
            medium: Memory
          name: vault-secrets
        - configMap:
            name: reports-deployment-vault-agent
          name: vault-agent-config
        - name: vault-agent-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: vault
                  expirationSeconds: 3600
                  path: token
