apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
spec:
  selector:
    matchLabels:
      app: reports
  template:
    metadata:
      annotations:
        vault-renderer.dadianas.com/official: 12eadf15250a0c9075ab8eb45e4ed9aa77dbec2035335482c44d1ab599a322e0
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-inject-file-config: app.env
        vault.hashicorp.com/agent-inject-secret-config: secret/data/reports/config
        vault.hashicorp.com/agent-inject-status: injected
        vault.hashicorp.com/agent-service-account-token-volume-name: vault-renderer-token
        vault.hashicorp.com/role: reports
        vault.hashicorp.com/service: https://vault.example.com
      labels:
        app: reports
    spec:
      containers:
        - image: example.com/reports:1.0
          name: reports
          volumeMounts:
            - mountPath: /vault/secrets
              name: vault-secrets
        - args:
            - echo ${VAULT_CONFIG?} | base64 -d > /home/vault/config.json && vault agent -config=/home/vault/config.json
          command:
            - /bin/sh
            - -ec
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VAULT_LOG_LEVEL
              value: info
            - name: VAULT_LOG_FORMAT
              value: standard
            - name: VAULT_CONFIG
              value: 
          image: hashicorp/vault:2.0.4
          lifecycle: {}
          name: vault-agent
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 100
          volumeMounts:
            - mountPath: /var/run/secrets/vault.hashicorp.com/serviceaccount
              name: vault-renderer-token
              readOnly: true
            - mountPath: /home/vault
              name: home-sidecar
            - mountPath: /vault/secrets
              name: vault-secrets
      initContainers:
        - args:
            - echo ${VAULT_CONFIG?} | base64 -d > /home/vault/config.json && vault agent -config=/home/vault/config.json
          command:
            - /bin/sh
            - -ec
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VAULT_LOG_LEVEL
              value: info
            - name: VAULT_LOG_FORMAT
              value: standard
            - name: VAULT_CONFIG
              value: 
          image: hashicorp/vault:2.0.4
          name: vault-agent-init
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 100
          volumeMounts:
            - mountPath: /home/vault
              name: home-init
            - mountPath: /var/run/secrets/vault.hashicorp.com/serviceaccount
              name: vault-renderer-token
              readOnly: true
            - mountPath: /vault/secrets
              name: vault-secrets
      serviceAccountName: reports
      volumes:
        - name: vault-renderer-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
        - emptyDir:
            medium: Memory
          name: home-init
        - emptyDir:
            medium: Memory
          name: home-sidecar
        - emptyDir:
            medium: Memory
          name: vault-secrets
